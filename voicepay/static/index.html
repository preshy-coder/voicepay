<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VoicePay</title>
<style>
  :root { --bg:#0d1117; --card:#161b22; --line:#30363d; --text:#e6edf3; --muted:#8b949e;
          --accent:#ff6a3d; --ok:#3fb950; --warn:#d29922; --bad:#f85149; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui,sans-serif; }
  main { max-width:560px; margin:0 auto; padding:24px 16px 64px; }
  h1 { margin:0 0 4px; } .sub { color:var(--muted); margin:0 0 20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  h2 { margin:0 0 12px; font-size:1rem; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
  input { width:100%; padding:10px 12px; margin:0 0 10px; background:var(--bg); color:var(--text);
          border:1px solid var(--line); border-radius:8px; font:inherit; }
  button { padding:10px 14px; border:0; border-radius:8px; background:var(--accent); color:#fff;
           font:inherit; font-weight:600; cursor:pointer; }
  button.secondary { background:transparent; border:1px solid var(--line); color:var(--text); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .row { display:flex; gap:8px; } .row > * { flex:1; }
  #mic { width:72px; height:72px; border-radius:50%; font-size:28px; flex:none; }
  #mic.live { animation:pulse 1s infinite; }
  @keyframes pulse { 50% { box-shadow:0 0 0 12px rgba(255,106,61,.25); } }
  .center { display:flex; align-items:center; gap:14px; }
  #msg { min-height:1.4em; margin:8px 0 0; } .ok{color:var(--ok)} .warn{color:var(--warn)} .bad{color:var(--bad)}
  ul { margin:6px 0 0; padding-left:20px; color:var(--muted); }
  table { width:100%; border-collapse:collapse; font-size:.9rem; } td,th { text-align:left; padding:6px 4px; border-bottom:1px solid var(--line); }
  .hidden { display:none; }
  small { color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>🎙️ VoicePay</h1>
  <p class="sub">Sandbox</p>

  <section class="card" id="auth">
    <h2>Sign in</h2>
    <input id="user" placeholder="Username" autocomplete="username">
    <input id="pin" placeholder="PIN (4-6 digits)" type="password" inputmode="numeric" autocomplete="current-password">
    <div class="row">
      <button id="login">Log in</button>
      <button id="register" class="secondary">Register</button>
    </div>
  </section>

  <div id="app" class="hidden">
    <section class="card">
      <h2>Speak a command</h2>
      <div class="center">
        <button id="mic" title="Hold to speak">🎙️</button>
        <div><div id="hint">Tap the mic and tell me who to pay.Your PIN Finishes it</div><small id="micnote"></small></div>
      </div>
      <input id="text" placeholder="…or type it here" style="margin-top:12px">
      <button id="send">Submit command</button>
      <p id="msg"></p>
    </section>

    <section class="card hidden" id="confirm">
      <h2>Confirm payment</h2>
      <p id="confirmText"></p>
      <ul id="reasons"></ul>
      <input id="vpin" placeholder="PIN" type="password" inputmode="numeric" style="margin-top:12px">
      <input id="otp" placeholder="One-time code (check the server console)" inputmode="numeric" class="hidden">
      <button id="verify">Verify &amp; send</button>
    </section>

    <section class="card">
      <h2>Add a contact</h2>
      <div class="row"><input id="cname" placeholder="Name"><input id="cphone" placeholder="07XXXXXXXX"></div>
      <button id="addc" class="secondary">Save contact</button>
    </section>

    <section class="card">
      <h2>History</h2>
      <table><thead><tr><th>To</th><th>KES</th><th>Status</th></tr></thead><tbody id="hist"></tbody></table>
    </section>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
let token = null, pending = null;

function say(text, cls) { const m = $("msg"); m.textContent = text; m.className = cls || ""; }

async function api(method, path, body) {
  const res = await fetch(path, {
    method, headers: token ? { Authorization: "Bearer " + token } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || "request failed");
  return data;
}

async function authenticate(path) {
  try {
    const creds = { username: $("user").value.trim(), pin: $("pin").value };
    if (path === "/register") await api("POST", "/register", creds);
    token = (await api("POST", "/login", creds)).token;
    $("auth").classList.add("hidden"); $("app").classList.remove("hidden");
    loadHistory();
  } catch (e) { alert(e.message); }
}
$("login").onclick = () => authenticate("/login");
$("register").onclick = () => authenticate("/register");

async function submitCommand(text) {
  $("confirm").classList.add("hidden"); pending = null;
  if (!text.trim()) return;
  try {
    const t = await api("POST", "/voice/command", { text });
    $("reasons").replaceChildren(...t.risk_reasons.map(r => Object.assign(document.createElement("li"), { textContent: r })));
    if (t.status === "BLOCKED") { say("Blocked for your safety: " + (t.risk_reasons.join(", ") || "high risk"), "bad"); return; }
    pending = t; say("");
    $("confirmText").textContent = t.confirmation;
    $("otp").classList.toggle("hidden", !t.requires_otp);
    $("vpin").value = ""; $("otp").value = "";
    $("confirm").classList.remove("hidden");
  } catch (e) { say(e.message, "bad"); }
}
$("send").onclick = () => submitCommand($("text").value);

$("verify").onclick = async () => {
  if (!pending) return;
  try {
    const r = await api("POST", `/transactions/${pending.transaction_id}/verify`,
                        { pin: $("vpin").value, otp: $("otp").value || undefined });
    say("Sent. Reference " + r.reference, "ok");
    $("confirm").classList.add("hidden"); pending = null; $("text").value = ""; loadHistory();
  } catch (e) { say(e.message, "bad"); }
};

$("addc").onclick = async () => {
  try { await api("POST", "/contacts", { name: $("cname").value, phone: $("cphone").value });
        say("Contact saved", "ok"); $("cname").value = $("cphone").value = ""; }
  catch (e) { say(e.message, "bad"); }
};

async function loadHistory() {
  const { transactions } = await api("GET", "/transactions");
  $("hist").replaceChildren(...transactions.map(t => {
    const tr = document.createElement("tr");
    for (const v of [t.payee_name || t.payee_phone, t.amount.toLocaleString(), t.status.replace("_", " ").toLowerCase()]) {
      const td = document.createElement("td"); td.textContent = v; tr.appendChild(td);
    }
    return tr;
  }));
}

// Voice input via the browser's Web Speech API (Chrome / Edge)
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SR) { $("mic").disabled = true; $("micnote").textContent = "Voice not supported in this browser. Use Chrome or Edge, or type below."; }
else {
  const rec = new SR(); rec.lang = "en-KE"; rec.interimResults = false;
  rec.onresult = e => { const text = e.results[0][0].transcript; $("text").value = text; submitCommand(text); };
  rec.onend = () => $("mic").classList.remove("live");
  rec.onerror = e => say("Voice error: " + e.error, "bad");
  $("mic").onclick = () => { $("mic").classList.add("live"); rec.start(); };
  $("micnote").textContent = "Click the mic and speak.";
}
</script>
</body>
</html>
